services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apetit
      POSTGRES_USER: apetit
      POSTGRES_PASSWORD: apetit
    ports:
      - "5432:5432"
    volumes:
      - apetit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apetit -d apetit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apetit_postgres:
